[[repos]]
repo = "builtin"
hooks = [
    { id = "trailing-whitespace" },
    { id = "end-of-file-fixer" },
    { id = "check-merge-conflict" },
    { id = "check-toml" },
    { id = "check-yaml" },
    { id = "check-added-large-files", args = ["--maxkb=2048"] },
]

[[repos]]
repo = "local"
hooks = [
    {
        id = "clang-format",
        name = "Format C/C++",
        entry = "clang-format -i",
        language = "system",
        files = "\\.(cpp|hpp|c|h|cc|hh)$",
    },
]